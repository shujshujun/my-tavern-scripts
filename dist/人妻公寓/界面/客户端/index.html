2:{渠道:'摄像头',诊断:'无性婚姻——结婚六年,顾国栋从不碰她;她是这个家里被擦得最亮的收藏品',对症提示:'她什么都不缺,缺的是目光。把她当一个女人看——注意到她,比送她任何东西都贵重',确认前违和感:'允许埋淡淡的违和感,禁止点破:这个家干净得过分,像样板间;她待人周到,却礼貌得像隔一层玻璃;偶尔琴声弹到一半会停',确认后注入:'她的隐痛(常驻,她自己永远不说破):结婚六年,丈夫从不碰她——顾国栋爱惜她,像爱惜柜子里那套从不使用的茶具。她把日子过成了无可挑剔的展品:一尘不染的家、一丝不苟的发髻、准点亮灯的厨房,因为除了"保持完美"她没有别的事可做,也没有人来弄乱。她已经很多年没被当成一个女人看过。被注视时她脊背会绷直,那不是仪态,是身体在替她说话;有人真的"看见"她——注意到她的变化、她的用心、她作为女人的存在——她的平静会裂开一瞬,随即用礼貌盖住。踩中这个方向的回合,好感变化可以给到±5',对症礼物:['正红色口红'],偷窥:[{场景种子:'下午,学生刚走。她收拾好琴谱,坐回琴凳,自己弹了一小段——弹到一半停下,合上琴盖,手在琴盖上放了一会儿。然后起身,把本来就整齐的客厅又收拾了一遍',选项:['她弹的曲子很悲伤','她把没弹完的琴合上了,手放在琴盖上很久','她收拾客厅的动作很熟练','她教学生时很温柔'],正确:1,碎片文案:'琴是给学生弹的。她自己的那一段,从来弹不完'},{场景种子:'傍晚,厨房准点亮灯。她做了两个人的饭,摆了两副碗筷,一个人坐下吃。吃到一半,她看了很久对面那副没动过的碗筷,然后起身,把另一半饭菜仔细装进保鲜盒,摞进冰箱——冰箱里已经摞了好几盒',选项:['她的厨艺很好,摆盘讲究','她吃饭时开着电视','冰箱里摞着好几盒没人吃的"另一半"','她今天做的是他爱吃的菜'],正确:2,碎片文案:'两副碗筷,一个人吃。冰箱里冻着的是一盒一盒"他不在"'},{场景种子:'夜里,她在浴室镜子前卸下发簪,长发落下来——你从没见过她披发的样子。她对着镜子看了很久,拿起梳子又放下,最后把头发原样挽了回去,关灯',选项:['她卸妆的手法很细致','她披下头发看了很久,又原样挽了回去','她的浴室和客厅一样一尘不染','她睡得很早'],正确:1,碎片文案:'披下来的头发只有镜子看过。看完,她自己把它收了回去'},{场景种子:'深夜,顾国栋出差前夜。书房灯还亮着,她端了茶走到书房门口,抬手,停住,没有敲。她端着茶在门口站了一会儿,把茶放在门边的柜子上,回了卧室——床的另一侧,被子叠得整整齐齐,像很久没人掀开过',选项:['她给丈夫准备了行李箱','书房的灯总是亮到很晚','她在门口停了很久,最后没有敲门','卧室床的另一侧,被子整齐得像陈列品'],正确:3,碎片文案:'那半边床不是空着,是从来没被用过。六年的婚姻睡成了单人间'}],信全文:'你把四个夜晚在脑子里拼到一起,像冲洗一卷底片:\n\n弹不完的琴。冻进冰箱的"另一半"。只有镜子看过的长发。还有那半边平整得像陈列品的床。\n\n顾国栋不是不爱她。他把她保养得很好,擦得很亮,摆在这个家最合适的位置上——像他柜子里那套舍不得用的茶具。\n\n结婚六年,没有人碰过她。也没有人,真正看过她。',开门正戏:'【开门正戏】{{user}}把礼物递给了沈静仪——一支正红色的口红。她的梳妆台上什么都有,唯独没有这种颜色:这种红不是涂给镜子看的,是涂给目光看的。演出她拆开它的完整过程:指尖停住、那句训练有素的"太贵重了"没能说完整、六年来第一次有人把她当"女人"而不是"顾太太"送东西。她的平静裂开一瞬——这是她心里那扇门松动的一楼,张力给足,不要一笔带过',死路提示:{翻垃圾:'她家的垃圾永远干干净净:分好类,扎好口,像刻意整理过。这条路上没有她的痕迹'}}};function v(e){return f[e]}const k=['早','午','晚','深夜'];function E(e){const t=Math.floor(Math.max(0,e)/2)%k.length;return k[t]}function g(...e){let t=1779033703^e.length;for(const n of e){const e=String(n);for(let n=0;n<e.length;n++)t=Math.imul(t^e.charCodeAt(n),3432918353),t=t<<13|t>>>19}return t=Math.imul(t^t>>>16,2246822507),t=Math.imul(t^t>>>13,3266489909),((t^=t>>>16)>>>0)/4294967296}function y(e,t){const n=
