了三年,全是热热闹闹的日子:奶茶、现场、追剧、晒饭。她把什么都晒出来——除了她没发过的那些。这条路上没有答案'}},102:{渠道:'摄像头',诊断:'无性婚姻——结婚六年,顾国栋从不碰她;她是这个家里被擦得最亮的收藏品',对症提示:'她什么都不缺,缺的是目光。把她当一个女人看——注意到她,比送她任何东西都贵重',确认前违和感:'允许埋淡淡的违和感,禁止点破:这个家干净得过分,像样板间;她待人周到,却礼貌得像隔一层玻璃;偶尔琴声弹到一半会停',确认后注入:'她的隐痛(常驻,她自己永远不说破):结婚六年,丈夫从不碰她——顾国栋爱惜她,像爱惜柜子里那套从不使用的茶具。她把日子过成了无可挑剔的展品:一尘不染的家、一丝不苟的发髻、准点亮灯的厨房,因为除了"保持完美"她没有别的事可做,也没有人来弄乱。她已经很多年没被当成一个女人看过。被注视时她脊背会绷直,那不是仪态,是身体在替她说话;有人真的"看见"她——注意到她的变化、她的用心、她作为女人的存在——她的平静会裂开一瞬,随即用礼貌盖住。踩中这个方向的回合,好感变化可以给到±5',对症礼物:['正红色口红'],偷窥:[{场景种子:'下午,学生刚走。她收拾好琴谱,坐回琴凳,自己弹了一小段——弹到一半停下,合上琴盖,手在琴盖上放了一会儿。然后起身,把本来就整齐的客厅又收拾了一遍',选项:['她弹的曲子很悲伤','她把没弹完的琴合上了,手放在琴盖上很久','她收拾客厅的动作很熟练','她教学生时很温柔'],正确:1,碎片文案:'琴是给学生弹的。她自己的那一段,从来弹不完'},{场景种子:'傍晚,厨房准点亮灯。她做了两个人的饭,摆了两副碗筷,一个人坐下吃。吃到一半,她看了很久对面那副没动过的碗筷,然后起身,把另一半饭菜仔细装进保鲜盒,摞进冰箱——冰箱里已经摞了好几盒',选项:['她的厨艺很好,摆盘讲究','她吃饭时开着电视','冰箱里摞着好几盒没人吃的"另一半"','她今天做的是他爱吃的菜'],正确:2,碎片文案:'两副碗筷,一个人吃。冰箱里冻着的是一盒一盒"他不在"'},{场景种子:'夜里,她在浴室镜子前卸下发簪,长发落下来——你从没见过她披发的样子。她对着镜子看了很久,拿起梳子又放下,最后把头发原样挽了回去,关灯',选项:['她卸妆的手法很细致','她披下头发看了很久,又原样挽了回去','她的浴室和客厅一样一尘不染','她睡得很早'],正确:1,碎片文案:'披下来的头发只有镜子看过。看完,她自己把它收了回去'},{场景种子:'深夜,顾国栋出差前夜。书房灯还亮着,她端了茶走到书房门口,抬手,停住,没有敲。她端着茶在门口站了一会儿,把茶放在门边的柜子上,回了卧室——床的另一侧,被子叠得整整齐齐,像很久没人掀开过',选项:['她给丈夫准备了行李箱','书房的灯总是亮到很晚','她在门口停了很久,最后没有敲门','卧室床的另一侧,被子整齐得像陈列品'],正确:3,碎片文案:'那半边床不是空着,是从来没被用过。六年的婚姻睡成了单人间'}],信全文:'你把四个夜晚在脑子里拼到一起,像冲洗一卷底片:\n\n弹不完的琴。冻进冰箱的"另一半"。只有镜子看过的长发。还有那半边平整得像陈列品的床。\n\n顾国栋不是不爱她。他把她保养得很好,擦得很亮,摆在这个家最合适的位置上——像他柜子里那套舍不得用的茶具。\n\n结婚六年,没有人碰过她。也没有人,真正看过她。',开门正戏:'【开门正戏】{{user}}把礼物递给了沈静仪——一支正红色的口红。她的梳妆台上什么都有,唯独没有这种颜色:这种红不是涂给镜子看的,是涂给目光看的。演出她拆开它的完整过程:指尖停住、那句训练有素的"太贵重了"没能说完整、六年来第一次有人把她当"女人"而不是"顾太太"送东西。她的平静裂开一瞬——这是她心里那扇门松动的一楼,张力给足,不要一笔带过',死路提示:{翻垃圾:'她家的垃圾永远干干净净:分好类,扎好口,像刻意整理过。这条路上没有她的痕迹',动态广场:'她的朋友圈和她的家一样一尘不染:插花、琴谱、下午茶,张张体面,条条得体。体面得看不见人——这条路上没有答案'}}};function C(e){return B[e]}B[201]={渠道:'打听',诊断:'娘家是个无底洞——弟弟的首付、妈的药钱全从她身上出;赵国强的工资一分不少上交,亏空她自己在夜里填',对症提示:'她的账本上每一笔都有去处,唯独没有一笔是花给她自己的。别送吃穿——把她肩上那笔"这个月"接过来一次',确认前违和感:'允许埋淡淡的违和感,禁止点破:她的精打细算过了头,像在填一个看不见的洞;每月总有一两天她起得特别早出门,回来后一整天格外省',确认后注入:'她的隐痛(常驻,她自己永远不说破):娘家把她当提款机——弟弟买房的首付是她瞒着赵国强掏的,妈的电话一来,第二天她准去银行。丈夫的工资她一分不动地记在明账上,亏空全靠她夜里给人缝改衣服、抠自己的嚼谷来填。她不是抠,她是在还一笔永远还不完的债,而这笔债连丈夫都不能知道。有人不问缘由地替她接住"这个月"的时候,她精明的壳会裂开一条缝——那不是钱的事,是二十年来第一次有人站在她这边算账。踩中这个方向的回合,好感变化可以给到±5',对症礼物:['房租宽限批条'],打听:[{对象:'菜场王姐',场景种子:'菜场收摊前,王姐一边归置菜筐一边接过伴手礼,压低声音:曼君啊,会过日子是真会过——可你见过谁买菜只挑蔫的?上回我留的好排骨,她摸了摸,又放下了,说家里"这个月紧"。月月都紧,紧了两年了',碎片文案:'「月月都紧,紧了两年了」——她的省不是习惯,是有个固定的窟窿'},{对象:'小卖部老板',场景种子:'小卖部老板就着烟接过好烟,呵呵一笑:赵家那口子?每月十五号准来我这儿取一趟汇款单回执——邮政的,汇出去的。金额嘛……比她男人一个月工资少不了多少。汇给谁?单子上姓许,不姓赵',碎片文案:'每月十五号,一笔接近整月工资的汇款,收款人姓许——汇回娘家的'},{对象:'收废品的陈叔',场景种子:'陈叔把纸箱捆上车,接过烟点上:她家纸箱最平整,可你猜怪不怪——她卖废品的钱从来不进兜,专门用一个铁盒子装着。有回盒子开着,里头还有一沓缝补活儿的零票。大半夜的,他们家缝纫机响到一两点,你听见过没?',碎片文案:'卖废品的零钱单独锁铁盒,缝纫机响到深夜——她在攒一笔丈夫不知道的钱'},{对象:'快递驿站小妹',场景种子:'驿站小妹收了奶茶,四下看看才说:许姐上个月替她弟弟收了个件,寄件人是售楼处,催缴尾款的那种红头函。她当场脸就白了,把函塞进包里,跟我说"别跟楼里人提"。哥,我就跟你一个人说了啊',碎片文案:'售楼处的催缴函,收件人是她弟弟,经手人是她——首付是她掏的,瞒着所有人'}],信全文:'你把四张嘴里的话在值班桌上对到一起,像对一本两面记的账:\n\n明面上,赵国强的工资一分不少,账本清清楚楚。暗地里,每月十五号一笔汇款、深夜响到一两点的缝纫机、锁在铁盒里的零票、还有那封她替弟弟收下的催缴函。\n\n弟弟的房,是她掏的首付。妈的电话一来,她第二天准去银行。\n\n楼里最会过日子的女人,过的从来不是自己的日子——她是许家的女儿,赵家的妻子,唯独不是许曼君。',开门正戏:'【开门正戏】{{user}}把一张房租宽限批条递给了许曼君——不是礼物,是"这个月先缓缓,我签了"。她第一反应是拒绝,精明的壳立起来:"这怎么行,账不能这么记。"但{{user}}没有问为什么紧,没有让她解释,没有要任何回报——只是把她肩上那笔"这个月"接了过去。演出她从立壳到破防的完整过程:嘴上还在算,手却没有把批条推回来;二十年来第一次,有人站在她这边算账。这是她心里那扇门松动的一楼,张力给足,不要一笔带过',死路提示:{翻垃圾:'她家垃圾比谁都少:纸箱拆平捆好能卖钱,能省的全省了。翻不出秘密,只翻得出节俭——她的账本不在垃圾袋里',摄像头:'镜头里她永远在算:记账、缝补、清点零钱。看一天也看不出破绽——数字都对,对得太用力了',动态广场:'翻了三年,半价战利品和省钱妙招。她把日子晒得明明白白——除了钱最后去了哪里。这条路上没有答案'}},B[202]={渠道:'丈夫',诊断:'何俊生外面有人——小满不知道,还在每天给他留一杯放凉的豆浆;她的安静不是性格,是被晾出来的',对症提示:'连丈夫喊她都只剩一声"哎"。她要的不多:有人把"周小满"三个字当回事,真真切切地记住她、看见她',确认前违和感:'允许埋淡淡的违和感,禁止点破:这家永远只有一人份的动静;她提起丈夫时用词体面,却说不出他最近的任何一件具体的事',确认后注入:'她的隐痛(常驻,她自己永远不说破):何俊生在外面有人——加班是假的,厂里的忙是假的,只有她每天留的那杯豆浆是真的,凉了热、热了凉。她隐约觉得不对,但不敢往下想,把疑心织进十字绣里,一针一针压下去。她的安静不是性格,是一个人守着两人份的家守出来的。她已经很久没被人完整地叫过名字——丈夫喊她"哎",楼里喊她"202的"。有人认真地叫她"周小满"、记得她说过的话、注意到她今天的不一样,她会先怔住,然后眼眶不受控制——不是感动,是委屈终于找到了出口。踩中这个方向的回合,好感变化可以给到±5',对症礼物:['刻名手链'],夫漏:[{信任门槛:12,场景种子:'楼下大排档,何俊生举着杯子跟你碰了一下,话到嘴边又咽回去:厂里最近……唉,没什么。喝酒喝酒。他把杯里的啤酒一口见了底,给你倒酒的手停了半拍',碎片文案:'「厂里最近……」他欲言又止,酒杯见底——"忙"这个字他自己都说不下去'},{信任门槛:25,场景种子:'第二回对饮,他话多了些:小满什么都好,真的,饭好吃,家里干净,脾气也好。就是……太安静了。回家跟没回一样,静得慌。你说人是不是贱,家里越静,越不想回',碎片文案:'「家里静得慌,越静越不想回」——她的安静,成了他不回家的理由'},{信任门槛:40,场景种子:'酒过三巡,他提起厂里一个"同事":有个同事说我这人有意思,你说我一个跑供应链的,有什么意思?说完他自己笑了笑,眼神从你脸上躲开,又灌了一大口,把话头硬拧回了球赛',碎片文案:'那个说他"有意思"的同事——他提起来的时候,眼神躲了'},{信任门槛:55,场景种子:'他烂醉,趴在桌上,忽然抓住你的手腕,力气大得吓人:兄弟,我对不起她……你别告诉她,千万别告诉她。桌上他的手机亮了一下,来消息了——备注不是名字,是一朵花的符号',碎片文案:'「我对不起她,你别告诉她」——他手机上那个备注,是一朵花'}],信全文:'你把四场酒在脑子里倒回去,像把一瓶酒重新装回瓶里:\n\n说不下去的"忙"。静得慌的家。那个说他"有意思"的同事。还有烂醉时抓着你手腕的那句"别告诉她",和他手机上一朵花的备注。\n\n何俊生外面有人。\n\n而202的灯每晚亮到十一点,豆浆凉了热、热了凉。她连委屈都绣进十字绣里——那对绣了一半的鸟,始终只有一只落了针。',开门正戏:'【开门正戏】{{user}}把一条手链递给了周小满——链坠上刻着两个字:小满。不是"202的",不是"何太太",不是"哎"。是她的名字。演出她拆开它的完整过程:先是不敢收的推让,然后指尖碰到那两个字,推让停住了;她低着头很久,声音比平时更小:"……你记得我叫什么。"眼眶背叛了她——不是感动,是委屈终于找到了出口。这是她心里那扇门松动的一楼,张力给足,不要一笔带过',死路提示:{翻垃圾:'垃圾里全是一人份:小包装的米,小份的菜,一只酸奶盒。安静得像这户只住了一个人——秘密不在她的垃圾里,在另一个人身上',摄像头:'镜头里的她安安静静:绣花、擦桌、把豆浆热了又热。看一整天,只看得到一个"等"字。她没有秘密——有秘密的不是她',动态广场:'翻了三年,温温吞吞的日子,连委屈都发得小心翼翼。她把自己缩得很小——答案不在她这里,在那个总不在家的人身上'}},B[301]={渠道:'动态广场',诊断:'恩爱是修出来的——江辰两年前就搬去律所住了;她一个人,拍着两人份的幸福',对症提示:'人人都在看她,没有人看见她。别当点赞的观众——当那个掌镜的人,给她拍一张不能修的照片',确认前违和感:'允许埋淡淡的违和感,禁止点破:她的生活好看得像广告,每一张都挑不出错;但她提起丈夫的语气,像在念一个设定',确认后注入:'她的隐痛(常驻,她自己永远不说破):江辰两年前就搬去律所住了,这段婚姻只剩一纸人设。她的动态广场上恩爱如常——纪念日、下午茶、"他补给我的"香水,全是她一个人布景、一个人出演、一个人点发送。她比谁都清楚表演和生活的区别,也比谁都害怕停下来:停更的那天,就是承认的那天。镜头是她的盔甲也是她的牢——人人都看她,没有人看见她。有人绕过滤镜看她本人、在没有镜头的时刻对她好,她的台词会接不上——那一瞬间的空白,是她唯一真实的表情。踩中这个方向的回合,好感变化可以给到±5',对症礼物:['拍立得相机'],信全文:'你把四条动态在屏幕上排到一起,像把四张剧照钉上软木板:\n\n纪念日的定位在家里,不在餐厅。两杯咖啡,一杯都没动过。素颜早安的眼睛是肿的。而最后一次出现在她动态里的江辰,停在两年前那场庆功宴。\n\n此后三年,张张精修,条条恩爱——出演者只有一个人。\n\n她不是在晒幸福。她是在直播一场没有对手戏的独角戏,台下坐满了人,没有一个人看出来。',开门正戏:'【开门正戏】{{user}}把一台拍立得递给了安若妍——"给你拍一张,不能修的那种。"她下意识摆出三分侧脸的标准角度,{{user}}没按快门,只是等。等她的台词接不上、等那个训练有素的笑维持不住的那一秒——咔嗒。相纸吐出来,显影的过程谁都修不了。演出她盯着那张慢慢显影的照片时的完整反应:那上面的女人不上镜、不完美、是真的。三年来第一次,有人的镜头里装的是她本人。这是她心里那扇门松动的一楼,张力给足,不要一笔带过',死路提示:{翻垃圾:'她的垃圾精致得像摆拍:网红店的外卖盒,大牌的包装袋,连丢弃都在维持人设。可惜摆拍本身不是罪证——答案不在楼下,在她的账号深处',摄像头:'镜头里她在补妆、找角度、一条视频重拍八遍。你看到的和全网看到的是同一场表演——后台不在这个房间里'}};const w={101:[{时间:'三个月前',文:'新邻居说我嗓门大😂 大就大呗,日子过得响亮一点怎么了!#我行我素#'},{时间:'半年前',文:'追完大结局!编剧你给我等着,寡姐怎么能下线!气得我干了两杯奶茶🧋',图:'101_追剧'},{时间:'去年秋天',文:'腌了两罐子糖蒜,一罐送楼上。谁家饭桌少得了这一口~',图:'101_糖蒜'},{时间:'去年夏天',文:'天台的床单晒得香喷喷!夏天就该是阳光的味道☀️',图:'101_床单'},{时间:'前年冬天',文:'嘉明加班,一个人涮了个小火锅。一个人也要吃得热热闹闹!',图:'101_火锅'},{时间:'前年秋天',文:'闺蜜说我婚后胖了……胖怎么了,幸福肥懂不懂!(明天开始跳操)'},{时间:'两年前',文:'搬新家啦!梧桐里7号,老楼是旧了点,但阳台超大,风铃一挂就是家了🎐'},{时间:'三年前',文:'最后一天营业,把店里最后一杯奶茶做给了自己。再见啦小店,再见啦站着笑的每一天',图:'101_奶茶店'},{时间:'三年前',文:'昨晚的现场太炸了!!嗓子喊哑了,值!下次还去!#livehouse#',图:'101_livehouse'},{时间:'四年前',文:'他说喜欢听我笑。哈哈哈那你可有福了,我别的不多,就笑声管够!'}],102:[{时间:'两个月前',文:'学生过了十级。教琴这些年,最开心的还是看着别人家的孩子一步步走远。'},{时间:'半年前',文:'春天的第一瓶插花。花艺老师说我插得太整齐了——可是整齐,不好吗?',图:'102_插花'},{时间:'去年冬天',文:'炖了汤,拍给他看。他说看起来很好喝。',图:'102_炖汤'},{时间:'去年秋天',文:'收拾出一套没用过的茶具,想了想,又原样放了回去。',图:'102_茶具'},{时间:'前年夏天',文:'国栋出差回来,带了当地的绸巾。颜色很衬客厅的窗帘。'},{时间:'两年前',文:'午后练琴一小时。德彪西还是弹不好后半段,大概是我心不够静。',图:'102_琴谱'},{时间:'三年前',文:'结婚纪念日。他订了很好的餐厅,菜很精致,灯光也很好。',图:'102_纪念日'},{时间:'四年前',文:'新家收拾好了。他说,这个家就交给你了。'},{时间:'五年前',文:'婚纱照选片,选了最端庄的那组。妈妈说,这才像顾太太。',图:'102_手捧花'},{时间:'六年前',文:'他求婚了。他说,他会给我最好的生活。'}],201:[{时间:'一个月前',文:'晚上八点半的超市,才是主妇的主场。今天赢了三盒半价的排骨。',图:'201_半价'},{时间:'三个月前',文:'又到月底了。'},{时间:'半年前',文:'阳台的辣椒红了!自己种的就是省……就是香,是香。',图:'201_辣椒'},{时间:'去年冬天',文:'国强的裤脚又磨了。改改还能穿两年,他也不挑。',图:'201_缝纫'},{时间:'去年秋天',文:'菜场王姐给我留的筒骨,炖一锅够吃两天。会过日子不丢人。',图:'201_菜市场'},{时间:'前年',文:'给弟弟寄了点东西。妈打电话说了很多,都记下了。'},{时间:'两年前',文:'搬来梧桐里了。房租比原来省了三百,阳台还朝南。挺好。'},{时间:'三年前',文:'织条围巾送妈。毛线是处理价买的,可暖和是一样的暖和。',图:'201_织围巾'}],202:[{时间:'一个月前',文:'早市的豆浆还是五毛钱的味道。俊生上早班,给他带了一份,放凉了。',图:'202_豆浆'},{时间:'两个月前',文:'巷口的猫今天肯让我摸了。它好像也在等人回家。',图:'202_猫'},{时间:'半年前',文:'绣了一半的小鸟。绣完这对,就把它挂在玄关,他进门就能看见。',图:'202_十字绣'},{时间:'去年冬天',文:'下雨了。听说下雨天想起的人,是心里住着的人。',图:'202_雨'},{时间:'去年',文:'两个人的桌子,一个人的饭。习惯就好,习惯就好。',图:'202_一人食'},{时间:'前年',文:'俊生说厂里最近忙。忙好,忙说明被需要着。'},{时间:'两年前',文:'搬家整理相册,结婚照上他笑得真好看。'},{时间:'三年前',文:'学着做了他老家的菜。咸了。他说,还行。'}],301:[{时间:'两周前',文:'新家附近居然有家及格的brunch,梧桐里也没那么糟嘛。',图:'301_下午茶'},{时间:'三周前',文:'结婚纪念日🥂 还是他订的老地方,还是熟悉的味道。年年有今日~',关键:{选项:['她的笑容一如既往地甜','定位显示在自家小区,不是任何餐厅','桌上的菜有点少'],正确:1,碎片文案:'纪念日的"老地方",定位在她自己家——餐厅是配的图,人没出门'}},{时间:'一个月前',文:'他补给我的。迟到三天的道歉,好在味道选对了。',图:'301_香水'},{时间:'三个月前',文:'自律给我自由。今天教练夸我体态是班里最好的~',图:'301_瑜伽'},{时间:'四个月前',文:'和江律师的周末日常☕ 岁月静好,不过如此。',关键:{选项:['背景的窗帘换过了',
