悲伤','她把没弹完的琴合上了,手放在琴盖上很久','她收拾客厅的动作很熟练','她教学生时很温柔'],正确:1,碎片文案:'琴是给学生弹的。她自己的那一段,从来弹不完'},{场景种子:'傍晚,厨房准点亮灯。她做了两个人的饭,摆了两副碗筷,一个人坐下吃。吃到一半,她看了很久对面那副没动过的碗筷,然后起身,把另一半饭菜仔细装进保鲜盒,摞进冰箱——冰箱里已经摞了好几盒',选项:['她的厨艺很好,摆盘讲究','她吃饭时开着电视','冰箱里摞着好几盒没人吃的"另一半"','她今天做的是他爱吃的菜'],正确:2,碎片文案:'两副碗筷,一个人吃。冰箱里冻着的是一盒一盒"他不在"'},{场景种子:'夜里,她在浴室镜子前卸下发簪,长发落下来——你从没见过她披发的样子。她对着镜子看了很久,拿起梳子又放下,最后把头发原样挽了回去,关灯',选项:['她卸妆的手法很细致','她披下头发看了很久,又原样挽了回去','她的浴室和客厅一样一尘不染','她睡得很早'],正确:1,碎片文案:'披下来的头发只有镜子看过。看完,她自己把它收了回去'},{场景种子:'深夜,顾国栋出差前夜。书房灯还亮着,她端了茶走到书房门口,抬手,停住,没有敲。她端着茶在门口站了一会儿,把茶放在门边的柜子上,回了卧室——床的另一侧,被子叠得整整齐齐,像很久没人掀开过',选项:['她给丈夫准备了行李箱','书房的灯总是亮到很晚','她在门口停了很久,最后没有敲门','卧室床的另一侧,被子整齐得像陈列品'],正确:3,碎片文案:'那半边床不是空着,是从来没被用过。六年的婚姻睡成了单人间'}],信全文:'你把四个夜晚在脑子里拼到一起,像冲洗一卷底片:\n\n弹不完的琴。冻进冰箱的"另一半"。只有镜子看过的长发。还有那半边平整得像陈列品的床。\n\n顾国栋不是不爱她。他把她保养得很好,擦得很亮,摆在这个家最合适的位置上——像他柜子里那套舍不得用的茶具。\n\n结婚六年,没有人碰过她。也没有人,真正看过她。',开门正戏:'【开门正戏】{{user}}把礼物递给了沈静仪——一支正红色的口红。她的梳妆台上什么都有,唯独没有这种颜色:这种红不是涂给镜子看的,是涂给目光看的。演出她拆开它的完整过程:指尖停住、那句训练有素的"太贵重了"没能说完整、六年来第一次有人把她当"女人"而不是"顾太太"送东西。她的平静裂开一瞬——这是她心里那扇门松动的一楼,张力给足,不要一笔带过',死路提示:{翻垃圾:'她家的垃圾永远干干净净:分好类,扎好口,像刻意整理过。这条路上没有她的痕迹',动态广场:'她的朋友圈和她的家一样一尘不染:插花、琴谱、下午茶,张张体面,条条得体。体面得看不见人——这条路上没有答案'}}};function N(e){return V[e]}const y={101:[{时间:'三个月前',文:'新邻居说我嗓门大😂 大就大呗,日子过得响亮一点怎么了!#我行我素#'},{时间:'半年前',文:'追完大结局!编剧你给我等着,寡姐怎么能下线!气得我干了两杯奶茶🧋',图:'101_追剧'},{时间:'去年秋天',文:'腌了两罐子糖蒜,一罐送楼上。谁家饭桌少得了这一口~',图:'101_糖蒜'},{时间:'去年夏天',文:'天台的床单晒得香喷喷!夏天就该是阳光的味道☀️',图:'101_床单'},{时间:'前年冬天',文:'嘉明加班,一个人涮了个小火锅。一个人也要吃得热热闹闹!',图:'101_火锅'},{时间:'前年秋天',文:'闺蜜说我婚后胖了……胖怎么了,幸福肥懂不懂!(明天开始跳操)'},{时间:'两年前',文:'搬新家啦!梧桐里7号,老楼是旧了点,但阳台超大,风铃一挂就是家了🎐'},{时间:'三年前',文:'最后一天营业,把店里最后一杯奶茶做给了自己。再见啦小店,再见啦站着笑的每一天',图:'101_奶茶店'},{时间:'三年前',文:'昨晚的现场太炸了!!嗓子喊哑了,值!下次还去!#livehouse#',图:'101_livehouse'},{时间:'四年前',文:'他说喜欢听我笑。哈哈哈那你可有福了,我别的不多,就笑声管够!'}],102:[{时间:'两个月前',文:'学生过了十级。教琴这些年,最开心的还是看着别人家的孩子一步步走远。'},{时间:'半年前',文:'春天的第一瓶插花。花艺老师说我插得太整齐了——可是整齐,不好吗?',图:'102_插花'},{时间:'去年冬天',文:'炖了汤,拍给他看。他说看起来很好喝。',图:'102_炖汤'},{时间:'去年秋天',文:'收拾出一套没用过的茶具,想了想,又原样放了回去。',图:'102_茶具'},{时间:'前年夏天',文:'国栋出差回来,带了当地的绸巾。颜色很衬客厅的窗帘。'},{时间:'两年前',文:'午后练琴一小时。德彪西还是弹不好后半段,大概是我心不够静。',图:'102_琴谱'},{时间:'三年前',文:'结婚纪念日。他订了很好的餐厅,菜很精致,灯光也很好。',图:'102_纪念日'},{时间:'四年前',文:'新家收拾好了。他说,这个家就交给你了。'},{时间:'五年前',文:'婚纱照选片,选了最端庄的那组。妈妈说,这才像顾太太。',图:'102_手捧花'},{时间:'六年前',文:'他求婚了。他说,他会给我最好的生活。'}],201:[{时间:'一个月前',文:'晚上八点半的超市,才是主妇的主场。今天赢了三盒半价的排骨。',图:'201_半价'},{时间:'三个月前',文:'又到月底了。'},{时间:'半年前',文:'阳台的辣椒红了!自己种的就是省……就是香,是香。',图:'201_辣椒'},{时间:'去年冬天',文:'国强的裤脚又磨了。改改还能穿两年,他也不挑。',图:'201_缝纫'},{时间:'去年秋天',文:'菜场王姐给我留的筒骨,炖一锅够吃两天。会过日子不丢人。',图:'201_菜市场'},{时间:'前年',文:'给弟弟寄了点东西。妈打电话说了很多,都记下了。'},{时间:'两年前',文:'搬来梧桐里了。房租比原来省了三百,阳台还朝南。挺好。'},{时间:'三年前',文:'织条围巾送妈。毛线是处理价买的,可暖和是一样的暖和。',图:'201_织围巾'}],202:[{时间:'一个月前',文:'早市的豆浆还是五毛钱的味道。俊生上早班,给他带了一份,放凉了。',图:'202_豆浆'},{时间:'两个月前',文:'巷口的猫今天肯让我摸了。它好像也在等人回家。',图:'202_猫'},{时间:'半年前',文:'绣了一半的小鸟。绣完这对,就把它挂在玄关,他进门就能看见。',图:'202_十字绣'},{时间:'去年冬天',文:'下雨了。听说下雨天想起的人,是心里住着的人。',图:'202_雨'},{时间:'去年',文:'两个人的桌子,一个人的饭。习惯就好,习惯就好。',图:'202_一人食'},{时间:'前年',文:'俊生说厂里最近忙。忙好,忙说明被需要着。'},{时间:'两年前',文:'搬家整理相册,结婚照上他笑得真好看。'},{时间:'三年前',文:'学着做了他老家的菜。咸了。他说,还行。'}],301:[{时间:'两周前',文:'新家附近居然有家及格的brunch,梧桐里也没那么糟嘛。',图:'301_下午茶'},{时间:'一个月前',文:'他补给我的。迟到三天的道歉,好在味道选对了。',图:'301_香水'},{时间:'三个月前',文:'自律给我自由。今天教练夸我体态是班里最好的~',图:'301_瑜伽'},{时间:'半年前',文:'应酬到十点。有些酒不好喝,也得笑着喝。',图:'301_夜景'},{时间:'去年',文:'整理首饰盒。每一件都有故事,有些故事不讲了。',图:'301_首饰'},{时间:'去年',文:'有人问我口红色号。宝,色号能抄,气质抄不来的哦。'},{时间:'前年',文:'换季断舍离,捐了两箱。旧的不去新的不来——对衣服,对什么,都一样。'},{时间:'两年前',文:'江律师又赢了一个案子。庆功宴的灯光,晃得人看不清人。'}]};y[302]=[{时间:'三个月前',文:'儿子今天正式上班了!就在妈眼皮底下上班😄 走路都带风',图:'302_背影'},{时间:'半年前',文:'楼里的太太们教我的,第一次自拍!拍了三十多张就这张能看😅',图:'302_自拍'},{时间:'去年冬天',文:'织到一半才想起来没问他喜欢什么颜色。算了,妈觉得好看就行',图:'302_毛衣'},{时间:'去年',文:'儿子说想吃妈做的红烧肉。多大了都是孩子',图:'302_一桌菜'},{时间:'前年',文:'老规矩,汤在锅里温着。他忙他的,妈等得起',图:'302_汤'},{时间:'两年前',文:'他爸又续了两年合同。也好,家里清净(才怪)。视频里晒黑了'},{时间:'三年前',文:'毕业典礼!妈的儿子最帅!(照片他不让发,哼)'},{时间:'五年前',文:'大学开学,送到车站没敢哭。回家路上买了他最爱吃的糖,忘了他不在家'},{时间:'十年前',文:'收拾柜子翻出来的。那时候多黏我啊,走哪儿背哪儿',图:'302_童年'},{时间:'十几年前',文:'第一次发这个朋友圈,跟儿子学的。他说妈你就发点日常。日常就是你呀'}];const h=['早上','中午','下午','傍晚','晚上','深夜'];function B(e){const t=Math.floor(Math.max(0,e)/3)%h.length;return h[t]}function b(e){return Math.floor(Math.max(0,e)/(3*h.leng
