('未触发').prefault('未触发')}).prefault({}),商店:n.z.object({解锁:n.z.coerce.boolean().catch(!1).prefault(!1),已购:n.z.array(n.z.string()).catch([]).prefault([])}).prefault({}),恶魔低语:n.z.string().prefault('')}),p=[0,20,40,60,80],E=['她是完整的修女:目光回避,言行守规,亲密的可能性为零;对神父只有职务性的互动','规矩出现了发丝般的裂缝:目光多停留一拍,独处不再立即结束;她开始注意他,并为此不安','界线在私下被越过:她开始贪恋被触碰的时刻,事后剧烈的罪恶感驱动她加倍虔诚或主动走向忏悔室','身体已经诚实:私下的她与人前的她判若两人;她开始主动制造独处的机会,同时恐惧被任何人看见','不再挣扎:她的归属已经改变(或正在改变);掩饰只是策略,不再是羞耻'],B=[{id:'作息',名称:'作息熄灯令',权重:'轻',原规:'日落即熄灯就寝,入夜行大静默,任何人不得无故离室;纠察嬷嬷每夜查寝。',档位:[{名称:'烛光特许',条文:'为夜间灵修之需,允许持烛活动至午夜;大静默改为轻声。',全局效果:'入夜后的走廊不再漆黑死寂:烛光在石壁上游移,修女们披着睡袍轻声走动、串门取水都不再犯规。夜间查寝失去突袭性——玛利亚必须提灯明着来。修道院的夜晚第一次有了活动空间。',支持门槛:12,堕落门槛:8,激进度:2},{名称:'夜祷自由',条文:'夜间起身祈祷、彻夜灵修皆属自由;废除查寝。',全局效果:'深夜的修道院成了法外之地:任何人深夜出现在任何公共角落都有"夜祷"这个完美理由,两人结伴的"共祷"也无人可查。谁的房门在深夜虚掩,只有天知道。',支持门槛:20,堕落门槛:18,激进度:4}]},{id:'服装',名称:'服装规范',权重:'轻',原规:'院内任何场合着全套会衣:罩袍、圣衣、头纱、领巾,层层齐整;毛发肌肤不得外露。',档位:[{名称:'劳作减负',条文:'盛夏与粗重劳作时,可免罩袍,着轻便亚麻工衣。',全局效果:'劳作时的修女第一次有了身体轮廓:亚麻工衣被汗水贴在背上,挽起的袖口露出小臂,弯腰时腰线毕现。庭院、厨房、药草园成了可以"看"的地方,而她们自己也开始意识到被看。',支持门槛:12,堕落门槛:8,激进度:3},{名称:'便装特许',条文:'院墙之内非礼仪场合,可着朴素俗家便装;头纱自愿。',全局效果:'头发解禁了。每个修女的便装选择泄露她的本性:有人依旧一身黑,有人翻出入会前的旧裙,有人开始在意领口和腰身。走廊里第一次出现了发色、颈线和身段的差别,修道院有了"她今天穿了什么"这个话题。',支持门槛:20,堕落门槛:18,激进度:6},{名称:'圣洁即坦诚',条文:'沐浴日、诊疗与寝舍走廊,薄衫单衣即合乎体统;圣洁之躯无需重重遮掩。',全局效果:'暴露公开化:沐浴日的走廊上是湿发和贴身单衣,医务室的检查不再隔着三层布,夏夜的寝舍门口有人只着衬裙乘凉。私下敢穿的,现在敢穿出房门了——谁的单衣最薄,全院心里都有一本账。',支持门槛:28,堕落门槛:30,激进度:9}]},{id:'缄默',名称:'用餐缄默',权重:'轻',原规:'食堂用餐全程缄默,只闻诵读员读经之声;交谈以手势代之。',档位:[{名称:'餐叙特许',条文:'晚餐可低声交谈,以敦姊妹之谊。',全局效果:'食堂活了:晚餐桌上有了闲谈、抱怨、传闻和笑声,谁和谁坐得近、谁给谁递了盘子都成了可读的信号。全院的情报开始在餐桌上流通,而神父的座位在谁旁边,人人都看在眼里。',支持门槛:12,堕落门槛:8,激进度:2},{名称:'节庆宴饮',条文:'主日及瞻礼日设宴,佐以本院葡萄酒;欢宴亦是感恩。',全局效果:'每逢主日,长桌上有肉有酒,烛火比平日多一倍。酒意让舌头变软、笑声变大、坐姿变松,平日说不出口的话在第三杯之后都说得出口。宴散后的走廊上,总有人步子发飘,需要人扶。',支持门槛:20,堕落门槛:18,激进度:4}]},{id:'饮食',名称:'饮食清规',权重:'轻',原规:'斋素为常,肉食唯病者可得;甜食为奢靡之物,禁绝;定量配给,过量为罪。',档位:[{名称:'丰馔解禁',条文:'肉食、甜点不再为禁,感恩享用即非罪。',全局效果:'罗莎的厨房终于放开了手脚:烤肉的香气飘满回廊,午后有了蜂蜜点心。修女们第一次被允许"喜欢吃"——咂嘴、回味、期待下一餐,感官的愉悦从此有了一个合法的入口。',支持门槛:12,堕落门槛:8,激进度:2},{名称:'佳酿工坊',条文:'重开酿酒坊与糕点房,产出售与山下及朝圣客,所得入院库。',全局效果:'修道院有了进项:圣维村人上山来买酒和蜜糕,院库的铜板声让玛尔大的眉头松了。院内酒水管制也随之松动——品酒、试新酿成了正当差事,厨房深夜亮灯不再稀奇。',支持门槛:20,堕落门槛:18,激进度:4,奉献金产出:15},{名称:'口腹之乐',条文:'进食乃神所赐之愉悦,细品、共享、相饲皆为感恩之仪。',全局效果:'吃变成了亲密行为:掰一块蜜糕递到对方唇边是"感恩之仪",舔去指尖的蜂蜜是惜物,共饮一杯是姊妹之谊。餐桌上的喂食、试味、交杯全部合法化,口唇之欲披上了圣仪的外衣。',支持门槛:28,堕落门槛:30,激进度:6}]},{id:'男女之防',名称:'男女之防',权重:'中',原规:'神父止步于主楼之外;与修女交谈须有第三人在场;肢体接触为大过。',档位:[{名称:'牧灵通行',条文:'神父为牧灵之需可入主楼公共区域;单独谈话于敞门之室为合规。',全局效果:'神父的脚步声出现在回廊、食堂、缮写室——修女们的日常空间里从此有了一个男人。单独说话不再需要第三双眼睛,只需一扇敞开的门;而门开多大,从来没人量过。',支持门槛:25,堕落门槛:25,激进度:5},{名称:'随召入室',条文:'灵修指导、病榻抚慰,神父可应召入修女私室。',全局效果:'一对一的密室从告解室扩展到了全院:任何一间小室,只要一句"我需要灵修指导",神父就可以合法地坐在她的床沿。房门依规虚掩,但走廊尽头的房间,虚掩和关上没有区别。',支持门槛:40,堕落门槛:45,激进度:10},{名称:'抚慰之手',条文:'神父奉神之名所行按手、执手、拥抱,为正式祝福仪轨,不在防禁之列。',全局效果:'触碰公开化:晨祷后神父按手祝福,额头、发顶、肩背;悲伤者可以被拥抱,病弱者可以被执手。每个修女都有了"被神父碰过哪里"的记忆,而祝福仪轨的边界,只存在于神父的手停下来的地方。',支持门槛:55,堕落门槛:62,激进度:15}]},{id:'寝室',名称:'寝室制度',权重:'中',原规:'单人小室,房门永不上锁亦不得闭死;姊妹互访寝室为禁;夜间独处己室。',档位:[{名称:'病弱陪护',条文:'病中、忧惧、噩梦缠身者,可请一位姊妹入室陪护。',全局效果:'寝室的门第一次为别人开了:发烧的夜里有人守在床边,噩梦惊醒时可以去敲隔壁的门。"她昨晚在谁房里"有了合法答案,也有了不必说破的部分。',支持门槛:25,堕落门槛:25,激进度:5},{名称:'同寝特许',条文:'寒夜无炭、病中畏寒者,姊妹同榻取暖合乎仁爱。',全局效果:'一张窄床睡两个人,成了山中寒夜的常态。体温、呼吸、贴着背的心跳——这些从前连想都是罪的东西,现在盖在同一床毯子下面。谁和谁"怕冷",全院都渐渐有了默契。',支持门槛:40,堕落门槛:45,激进度:10},{名称:'圣家共寝',条文:'寝制自由;姊妹共寝为相爱之见证,神家之内无可疑之事。',全局效果:'走廊尽头的规矩死了:门可以关,床可以并,谁在谁的房里过夜无人过问也无人敢问。寝舍从一排隔离的囚室变成了一片默许的暗域,夜里的动静只归夜晚管。',支持门槛:55,堕落门槛:62,激进度:15}]},{id:'告解',名称:'告解制度',权重:'中',原规:'每周一次格栅告解,神父与告解者不得相见;告解内容天条封缄。',档位:[{名称:'面对面告解',条文:'撤除格栅,面对面告解以显赤诚。',全局效果:'橡木隔间里没有了那层格栅:忏悔者与神父膝头相距一臂,红着的眼眶、咬住的嘴唇、绞紧的手指都看得一清二楚。罪从一段耳语变成了一场对视,而对视比耳语难熬得多,也诱人得多。',支持门槛:25,堕落门槛:25,激进度:4},{名称:'深度告解',条文:'言语难尽之罪,告解者可具陈情状乃至演示始末,以求赦之彻底。',全局效果:'"我说不清楚"有了下文:说不清的罪可以指给神父看,可以演给神父看。告解室里从此不只有声音——撩起的裙摆、指认的部位、复现的动作,一切以"赦罪需要彻底"为名。忏悔越具体,来忏悔的人反而越多。',支持门槛:40,堕落门槛:45,激进度:8},{名称:'肉身补赎',条文:'神父可依罪之轻重,开列以身补赎之苦行,亲督其行。',全局效果:'赦罪有了身体的代价:跪多久、伏在哪、承受什么,由神父量罪裁定并亲自监督。罪恶感最重的人来得最勤——她们需要被惩罚才能睡得着,而告解室永远为她们亮着灯。',支持门槛:55,堕落门槛:62,激进度:12}]},{id:'苦修',名称:'苦修方式',权重:'中',原规:'苦修以斋戒、跪祷、劳作为限;古法笞悔等伤身之行,非经院长特准不得行之。',档位:[{名称:'笞悔复古',条文:'恢复古法自笞,为免过度,须于神父监督下行之。',全局效果:'鞭子回到了修道院,而且必须当着神父的面用:褪到腰际的袍子、落在背上的绳结、数着数的喘息——痛感成了公开的仪式,而"监督"的神父是唯一的观众。有人怕它,有人在怕里尝出了别的东西。',支持门槛:25,堕落门槛:25,激进度:5},{名称:'代行笞悔',条文:'自笞难以如法者,由神父代行;持鞭之手奉神而动,不染罪愆。',全局效果:'鞭子交到了神父手里。俯伏、承受、由另一个人决定轻重缓急——代行笞悔是全院唯一合法的"交出身体"的仪式。请求代行的理由五花八门,但跪下去的姿势都一样。',支持门槛:40,堕落门槛:45,激进度:10},{名称:'极乐苦修',条文:'肉身之极致体验,无论苦乐,皆为涤魂之途;修行不问其状,只问其诚。',全局效果:'苦与乐的边界被一笔勾销:颤抖是虔诚,呻吟是祷告,极限的体验就是灵魂的净化。苦修室里的声音变了调,而院规说——不问其状,只问其诚。',支持门槛:55,堕落门槛:62,激进度:15}]},{id:'贞洁',名称:'贞洁誓愿',权重:'重',原规:'身心俱洁,思欲亦罪;凡涉情欲之念,须于告解尽述。',档位:[{名称:'思无罪',条文:'念起非罪,行方为罪;心念交予神断,不入人间之刑。',全局效果:'幻想合法了。夜里的辗转、走神的凝视、梦里的内容,统统不再需要羞愧——只要不做,想什么都可以。于是告解室里的忏悔换了内容:她们开始讲自己"想"了什么,讲得比以前任何罪都详细。',支持门槛:45,堕落门槛:55,激进度:10},{名称:'圣婚之仪',条文:'修女乃基督之新娘;神父为基督在世之代权者。愿领圣婚者,由神父代行合卺之仪,以全其誓。',全局效果:'贞洁誓愿被它自己的逻辑攻陷:既然她们是基督的新娘,而神父代表基督——那么"圣婚之夜"就不是背誓,而是圆誓。领过圣婚的修女戴上一枚素银指环,看神父的眼神从此不同;没领的,开始数自己够不够格。',支持门槛:60,堕落门槛:72,激进度:20},{名称:'肉身献祭',条文:'躯体为献神之祭,经神所立之手而献,愈献愈洁。',全局效果:'贞洁的定义被彻底倒转:守着身体不献,反而成了吝啬;经神父之手的每一次"献祭",都是誓愿的践行。修道院的夜晚不再需要任何借口,只需要一句"我愿献上"。',支持门槛:75,堕落门槛:85,激进度:30}]},{id:'服从',名称:'服从誓愿',权重:'重',原规:'于院长如于神:绝对服从,不辩,不疑,不诉。',档位:[{名称:'灵俗双首',条文:'俗务听命于院长,灵性事务听命于神父;二权分立,各安其位。',全局效果:'特蕾莎的权杖被锯掉了一半:祈祷、告解、灵修、赦罪——凡沾"灵"字的事,最终裁量权归了神父。修女们第一次可以拿"神父说"顶回院长的话,而院长的脸色,全院都看见了。',支持门槛:45,堕落门槛:55,激进度:9},{名称:'牧权优位',条文:'灵俗相争之处,以神父之裁断为先;牧者之责,重于管家之权。',全局效果:'两权相争,神父说了算。院长的每一道命令理论上都可以被"灵性理由"推翻,纠察的告发要先过神父的案头。权力的天平肉眼可见地倾斜,依附强者的本能开始在修女中间起作用。',支持门槛:60,堕落门槛:72,激进度:18},{名称:'绝对牧权',条文:'牧者之意即神之意;顺服神父,身心无所保留。',全局效果:'服从的对象换了人,而且加上了"身心"二字。神父的一句话就是院规,一个眼神就是指令;"无所保留"四个字写在石墙上,每个修女路过时都会想一想它包括什么——然后发现自己并不抗拒这个答案。',支持门槛:75,堕落门槛:85,激进度:27}]},{id:'清贫',名称:'清贫誓愿',权重:'重',原规:'无私产,不蓄财;院产共有,奢华为罪;不受外人之馈。',档位:[{名称:'院产经营',条文:'院产可对外经营生利,所得归公,以续圣工。',全局效果:'修道院开始挣钱了:酒、蜜、药草、手工圣物,山下的商路重新打通,账房的算盘声成了新的日课。玛尔大挺直了腰杆,而"为了院库"四个字,渐渐能给很多事开门。',支持门槛:45,堕落门槛:55,激进度:8,奉献金产出:20},{名称:'私产特许',条文:'修女可持有小额私产,受馈赠而不逾礼者非罪。',全局效果:'礼物合法了。一条缎带、一瓶香膏、一册诗集——修女们开始拥有"自己的东西",也开始在意谁送的。小小的虚荣与偏爱有了寄生之处,而送礼的人,买到的从来不只是感谢。',支持门槛:60,堕落门槛:72,激进度:16},{名称:'献仪圣事',条文:'朝圣者之奉献直通圣宠;奉献愈厚,所得祝福愈亲。圣帕瞻仰、私人祈福、修女伴祷,皆可依献仪之数而设。',全局效果:'祝福明码标价了:大额奉献者可获圣帕私瞻、修女伴祷、彻夜"代祷"。什么样的献仪配什么样的"亲近",全院渐渐形成一张心照不宣的价目表——而价目表的顶端写着什么,取决于这座修道院已经堕落到了哪里。',支持门槛:75,堕落门槛:85,激进度:24,奉献金产出:50}]}];function
