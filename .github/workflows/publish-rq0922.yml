name: publish-rq0922

on:
  push:
    branches:
      - release/rq0922
    paths:
      - .github/workflows/publish-rq0922.yml

permissions:
  contents: write

concurrency:
  group: publish-rq0922
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@v4
        with:
          ref: rq0.92.2

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp 'dist/人妻公寓/人妻公寓.png' 'release-assets/rqgy-0.92.2.png'
          cp 'dist/人妻公寓/人妻公寓.json' 'release-assets/rqgy-0.92.2.json'
          cp 'dist/人妻公寓/发布校验_0.92.2.json' 'release-assets/rqgy-0.92.2-checksums.json'
          cp 'dist/人妻公寓/database-rq0922.json' 'release-assets/database-rq0922.json'
          cp 'dist/人妻公寓/database-rq0922-source.zip' 'release-assets/database-rq0922-source.zip'

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view rq0.92.2 >/dev/null 2>&1; then
            gh release edit rq0.92.2 \
              --title '《人妻公寓》v0.92.2' \
              --notes-file 'src/人妻公寓/发布说明_v0.92.2_2026-09-13.md' \
              --latest
          else
            gh release create rq0.92.2 \
              --verify-tag \
              --title '《人妻公寓》v0.92.2' \
              --notes-file 'src/人妻公寓/发布说明_v0.92.2_2026-09-13.md' \
              --latest
          fi
          gh release upload rq0.92.2 release-assets/* --clobber

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view rq0.92.2 --json tagName,isDraft,isPrerelease,url,assets \
            --jq '{tagName,isDraft,isPrerelease,url,assets:[.assets[]|{name,size,state}]}'
