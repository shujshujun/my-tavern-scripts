                      - text: 安装角色卡与运行环境
                    - paragraph [ref=f12e130]: 导入角色卡后，安装并启用【酒馆助手】，并确认角色卡自带的 MVU 脚本已启用。当前检测到 4.9.1，已是官方最新版本。若不是最新版，建议更新，但不会阻止开始游戏。
                  - listitem [ref=f12e131]:
                    - generic [ref=f12e132]:
                      - emphasis [ref=f12e133]: "2"
                      - text: 启用【提示词模板】插件
                    - paragraph [ref=f12e134]: 提示词模板必须开启；如果装有【小白X】，请先关闭，避免两套注入同时工作造成正文或变量异常。
                  - listitem [ref=f12e135]:
                    - generic [ref=f12e136]:
                      - emphasis [ref=f12e137]: "3"
                      - text: 长期记忆插件二选一
                    - paragraph [ref=f12e138]: 选择路线后先关闭另一套，再点“重新检测”。检测未通过时不要继续安装另一套。
                    - generic [ref=f12e139]:
                      - button "使用数据库" [ref=f12e140] [cursor=pointer]
                      - button "使用智脑" [ref=f12e141] [cursor=pointer]
                    - paragraph [ref=f12e142]: 请在【酒馆助手→脚本→全局脚本】中禁用或删除智脑并刷新页面，然后安装数据库插件和人妻公寓四张 RQ_ 表。
                    - paragraph [ref=f12e143]: 建议随后在数据库设置中开启 SQLite 模式：四张表都带完整 SQL DDL，游戏会优先使用参数化 SQL 精确查询与更新。普通表格模式仍可读取完整快照，数据库插件自身的正文长期记忆/承诺也照常运行；但游戏脚本不再用可能挂到旧消息的普通行接口直写剧情事件或微信摘要。数据库没有公开的自动切换接口，因此需要玩家手动开启。
                    - paragraph [ref=f12e144]: 自动填表默认把人物记忆与承诺合并为每 3 个正文 AI 楼一次，社交轨迹每 6 楼一次；SQLite 模式下，剧情事件和重要社交结果由游戏脚本即时写入。没有长期变化时允许不改表，不应为了凑字数制造记录。
                    - paragraph [ref=f12e145]: 数据库当前会把全局“AI 回复最小长度”同时用于正文门控和填表输出。建议设为 0，避免把合法的简短或空更新误报为“AI回复过短”；“填表最大重试”建议手动设为 2。微信进展摘要走独立 callAI，不受这两个填表参数影响。
                    - paragraph [ref=f12e146]: 完整微信原文仍只保存在手机；开启微信记忆且 SQLite 可写时，每轮有效妻子私聊通常会额外调用一次数据库当前 AI，把当前分支的未整理增量压成结构化短进展。普通表格模式会暂停这次额外摘要调用。正文只在本人可靠判定在场时被动参考，不要求角色每轮主动提起；该功能可在手机“我”页单独关闭。
                    - generic [ref=f12e147]:
