# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/worldbook.zh.json
# 说明:常驻条目用 蓝灯(常量);按名激活用 绿灯+关键字;插入位置必须带 顺序。
# 角色条目开关纪律(第四态休眠):二三批户(201/202/301)条目出厂关闭,入住事件楼由脚本开启。
# 机制规则(表现通道/人格防线/认知隔离/界线白名单/行为等级/行动选项)不进世界书——
# 藏在脚本里随快照每轮注入(snapshotSystem.ts,玩家不可见不可关,按场景动态裁剪)。

条目:
  # ============================================
  # 系统设定
  # ============================================
  - 文件夹: 系统设定
    条目:
      - 名称: 梧桐里7号
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之后
          顺序: 100
        文件: 系统设定/世界观

      # 开场流程(修道院范式):first_mes=【主页】标记→正则换客户端界面;
      # 叙事开场白进 alternate_greetings,序章(难度选择→父亲来电固定楼)由回合引擎创建
      - 名称: '[开场白]进可选开场白勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之后
          顺序: 100
        文件: 系统设定/开场白

  # ============================================
  # 角色(主角常驻;住户条目出厂关闭,随入住由脚本按名启用)
  # ============================================
  - 文件夹: 角色
    条目:
      - 名称: 管理员
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 98
        文件: 角色/主角

      - 名称: 夏乔
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [夏乔, '101']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/夏乔

      - 名称: 沈静仪
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [沈静仪, '102']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/沈静仪

      - 名称: 顾国栋
        启用: true
        激活策略:
          类型: 绿灯
          关键字: ['丈夫焦点:顾国栋']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/顾国栋

      # P5 阵容波:妻条目随入住开启；普通丈夫资料并入妻条目，不再单独占入口。
      # 只有承担专线的丈夫保留独立条目，并由脚本在本人实际在场时用“丈夫焦点”标记激活。
      - 名称: 许曼君
        启用: false
        激活策略:
          类型: 绿灯
          关键字: [许曼君, '201']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/许曼君

      - 名称: 周小满
        启用: false
        激活策略:
          类型: 绿灯
          关键字: [周小满, '202']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/周小满

      - 名称: 何俊生
        启用: false
        激活策略:
          类型: 绿灯
          关键字: ['丈夫焦点:何俊生']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/何俊生

      - 名称: 安若妍
        启用: false
        激活策略:
          类型: 绿灯
          关键字: [安若妍, '301']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/安若妍

  # ============================================
  # 变量系统
  # ============================================
  - 文件夹: 变量
    条目:
      - 名称: '[initvar]变量初始化勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 变量/initvar

      - 名称: '[mvu_update]变量更新规则'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 100
        文件: 变量/变量更新规则

      - 名称: '[mvu_update]变量输出格式'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 99
        文件: 变量/变量输出格式

      # 本轮可写变量视图=MVU replace 的绝对值基线(勿关)。只含焦点且本人在场的演员叶子；
      # 日常不提供堕落/身体开发，独立脚本场景与无人场景为空户表。后台住户、资源、经济、阶段、婚姻及
      # 所有脚本字段均不进入提示。原生路径会在 PROMPT_READY 直接覆盖已展开的旧视图，防换场残留。
      - 名称: '[mvu_update]变量更新列表'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 98
        内容: |
          ---
          只允许 replace 下方实际存在的叶子路径；未列路径一律只读。若户为空，JSON Patch 必须为 []。
          <status_current_variable>
          {{format_chat_variable::_整表视图}}
          </status_current_variable>
