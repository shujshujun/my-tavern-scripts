# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/worldbook.zh.json
# 说明:常驻条目用 蓝灯(常量);按名激活用 绿灯+关键字;插入位置必须带 顺序。
# 角色条目开关纪律(第四态休眠):二三批户(201/202/301)条目出厂关闭,入住事件楼由脚本开启。
# 机制规则(表现通道/人格防线/认知隔离/界线白名单/行为等级/行动选项)不进世界书——
# 藏在脚本里随快照每轮注入(snapshotSystem.ts,玩家不可见不可关,按场景动态裁剪)。

条目:
  # ============================================
  # 系统设定
  # ============================================
  - 文件夹: 系统设定
    条目:
      - 名称: 梧桐里7号
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之后
          顺序: 100
        文件: 系统设定/世界观

      # 开场流程(修道院范式):first_mes=【主页】标记→正则换客户端界面;
      # 叙事开场白进 alternate_greetings,序章(难度选择→父亲来电固定楼)由回合引擎创建
      - 名称: '[开场白]进可选开场白勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之后
          顺序: 100
        文件: 系统设定/开场白

  # ============================================
  # 角色(主角常驻;住户绿灯按名激活;后批户条目待P5补,出厂关闭)
  # ============================================
  - 文件夹: 角色
    条目:
      - 名称: 管理员
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 98
        文件: 角色/主角

      - 名称: 夏乔
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [夏乔, '101']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/夏乔

      - 名称: 沈静仪
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [沈静仪, '102']
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/沈静仪

      - 名称: 顾国栋
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [顾国栋]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/顾国栋

      - 名称: 陆嘉明
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [陆嘉明]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/陆嘉明

      # TODO(P5 阵容波):母亲(302,入列前不建条目=系统级隐身)/
      # 201许曼君+赵国强/202周小满+何俊生/301安若妍+江辰(入住事件楼脚本开启)

  # ============================================
  # 变量系统
  # ============================================
  - 文件夹: 变量
    条目:
      - 名称: '[initvar]变量初始化勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 变量/initvar

      - 名称: '[mvu_update]变量更新规则'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 100
        文件: 变量/变量更新规则

      - 名称: '[mvu_update]变量输出格式'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 99
        文件: 变量/变量输出格式

      # 整表注入=MVU 记账地基(云霜凝同款,勿关):AI 的 JSON Patch replace 须知当前值,身体开发等
      # 可写字段只在这张表里。防泄底靠"裂缝内容在代码不进变量";AI 拿背包/现金加戏靠快照演出纪律拦。
      - 名称: 变量更新列表
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 98
        内容: |
          ---
          <status_current_variable>
          {{format_message_variable::stat_data}}
          </status_current_variable>
