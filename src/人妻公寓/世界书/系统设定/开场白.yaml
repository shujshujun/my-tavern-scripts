# 开场白(叙事版;固定0楼架构下0楼=客户端界面,本条目作 alternate_greetings 备选与逃生舱开场)

傍晚六点,最后一班公交把你丢在梧桐里巷口。七月的热气贴着柏油路往上翻,你拖着一只旧行李箱走过修鞋摊、关了一半卷帘门的小卖部,终于在门牌掉漆的7号楼前停下。

这就是父亲口中那份“正经差事”。

三层的老公寓夹在两栋新楼之间,外墙爬着雨水留下的灰痕,门洞上方的灯忽明忽暗。可它并不冷清。一楼101的窗户开着,油锅爆响和饭菜香一起涌进院子,门外鞋架挤得满满当当;隔壁102的窗帘拉得整整齐齐,缝里透出一线暖黄,隐约有人在琴键上试了两个音。二楼暂时黑着,空阳台上晾衣绳被风吹得轻轻敲墙。三楼只有最里面一扇窗亮着——那是你从小住过的家。

窗子“哗”地推开,你妈探出头来。她围裙还系在腰上,一手拿着汤勺,嗓门毫不费力地穿透整条巷子:“回来啦?怎么也不提前说一声!先上来吃饭,汤都炖好了!”

“我先把东西放了!”你仰头喊。

她还想说什么,厨房里定时器响了,那张熟悉的脸便从窗口消失。很快,楼上传来她踩着拖鞋来回忙活的声音。你忽然想起父亲离开国内以后,她一个人守着家,也替他看着这栋楼,已经很多年了。

管理员室藏在楼梯背面,门锁比记忆里更涩。你换了三把钥匙才听见锁舌弹开。门里有股纸张、机油和旧木头混在一起的味道:一张掉漆的值班桌,一只边角磕凹的铁皮柜,墙上挂着整整十六把钥匙。每把钥匙都缠着褪色胶布,门牌号是前任管理员用圆珠笔写的,有几枚已经被手指磨得看不清。

桌面留下了一本住户登记簿、一沓租约复印件和几张泛黄的报修单。最上面那张来自101,写着厨房水管渗漏,日期已经是两个星期前;下面还压着声控灯、电表箱和楼顶积水的记录。父亲说这是让你“管一栋楼”,真正摆到眼前,却像把十几户关起门来的麻烦同时塞进了你手里。

登记簿旁放着一个牛皮纸信封。你拆开,里面没有钱,只有父亲那种硬得像钉子的字:

“钥匙十六把,一把都不能丢。账要清楚,人要认全。等我电话。”

你把纸翻到背面,果然一个字也没有。他向来如此,能用三句话说完的事绝不会说第四句。大学毕业以后你换了两份工作,每次父亲打电话都只问“干得怎么样”。这一次,他干脆把半辈子的心血推到你面前,连同那句没写在纸上的警告:管不好,就去二叔的码头报到。

楼道里忽然响起脚步声。101的门被推开一条缝,风铃清脆地叮了一声。一个女人提着垃圾袋出来,先朝陌生的行李箱看了一眼,又隔着门洞向你笑笑:“新管理员?”

你还没来得及回答,她已经被屋里的人叫了回去。门合上以后,笑声和饭菜香仍留在楼道里。102那边也传来轻轻的关窗声,窗帘后的影子停了一瞬,随即消失。

你把行李箱立进墙角,坐上那把一动就吱呀作响的椅子。头顶是母亲摆碗筷的声音,面前是钥匙、账本和一栋尚未认识你的楼。这里的每一扇门后都有自己的日子:有人等丈夫回家,有人把争吵压低到邻居听不见,也有人会在需要帮助时,先想起刚刚到任的管理员。

从今晚起,这些都归你管了。

值班桌上的手机忽然亮起,沿着木纹急促地震动。

来电显示:爸。
