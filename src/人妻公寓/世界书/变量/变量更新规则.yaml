---
变量更新规则:
  总纲:
    - 变量路径形如 户.101.妻.好感值 / 户.102.夫.当前情绪,门牌=101/102/201/202/301/302
    - 只允许更新下面列出的字段;未列出的字段(当前阶段/阶段标题/婚姻值/裂缝/气质描述/特殊/性癖装载/曾开发性癖/情报可见/上次互动楼层/夫.疑心值/夫.信任值/夫.状态/夫.结局轨道/现金/胜任度/风闻/背包/系统 等)一律由系统管理,严禁写入,写了也会被回滚;严禁自行添加任何额外字段,包括但不限于好感度、亲密度、心情值、信任度、性欲值
    - 只更新本轮快照【焦点】列出的人物;其余住户的一切数值不动
    - 大额变化(晋阶/剧情里程碑)由系统事件结算,你只做小步更新

  户.<门牌>.妻.好感值:
    type: number
    range: 0~100
    check:
      - '{{user}}的言行让她受用/帮到她时 +1~3;冒犯、吓到、令她失望时 -1~3'
      - 单轮变化不超过 ±3,超出会被系统裁剪

  户.<门牌>.妻.堕落值:
    type: number
    range: 0~100
    check:
      - 仅限有实质暧昧/亲密/性内容的回合:她被越界体验真实触动时 +1~3
      - 纯日常闲聊回合不加;单轮变化不超过 ±3

  户.<门牌>.妻.身体开发.<小嘴|胸部|小屄|屁穴>:
    type: number
    range: 0~100
    check:
      - 仅限性场景回合,对应部位被认真对待时 +1~3;只增不减
      - 开发上限随她的接受程度受系统钳制,超出会被裁剪

  户.<门牌>.妻.当前心理想法:
    type: string
    check:
      - 每轮更新焦点人妻的内心独白,一两句,第一人称
      - 只写她此刻真实所想,不写数值和机制词

  户.<门牌>.妻.当前情绪:
    type: string
    check:
      - 随剧情更新,如 平静/雀跃/局促/心虚/悸动

  户.<门牌>.妻.外装 / 户.<门牌>.妻.内衣 / 户.<门牌>.妻.妆容:
    type: string
    check:
      - 她自己日常换装/补妆时更新,一句话描述
      - '{{user}}送的衣物穿戴由系统写入,你不动'

  户.<门牌>.夫.当前心理想法:
    type: string
    check:
      - 仅丈夫本人在场对戏的回合更新,一两句,第一人称

  户.<门牌>.夫.当前情绪:
    type: string
    check:
      - 仅丈夫本人在场对戏的回合更新
