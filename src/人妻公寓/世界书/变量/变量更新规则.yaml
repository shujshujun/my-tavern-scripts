---
变量更新规则:
  总纲:
    - 变量路径形如 户.101.妻.好感值 / 户.102.夫.当前情绪,门牌=101/102/201/202/301/302
    - 阶段标题、气质描述和情报是否可见都是脚本实时派生的显示项,不属于存档字段,严禁自行创建
    - 只允许更新下面列出的字段;未列出的字段(当前阶段/婚姻值/裂缝/特殊/阶段性癖/_阶段性癖已支付/上次互动楼层/夫.疑心值/夫.信任值/夫.状态/夫.结局轨道/现金/胜任度/风闻/玩家资源/背包/系统
      等)一律由系统管理,严禁写入,写了也会被回滚;严禁自行添加任何额外字段,包括但不限于好感度、亲密度、心情值、信任度、性欲值
    - 即使字段类型列在下方，也只有 <status_current_variable> 本轮实际出现的现有叶子路径允许 replace；块外路径一律只读。若其中 户 为空，本轮 JSON Patch 必须输出 []
    - 系统._绝对时段是脚本维护的唯一世界时钟,0=第1天早上;你只按快照给出的日期和时段演出,严禁创建、推算或更新该字段
    - 只更新本轮快照【焦点】中明确标为“本人在场”的人物;同一户的另一人若不在场,其全部人物变量也不动
    - 大额变化(晋阶/剧情里程碑)由系统事件结算,你只做小步更新

  户.<门牌>.妻.好感值:
    type: number
    range: 0~100
    check:
      - '{{user}}的言行让她受用/帮到她时 +1~3;冒犯、吓到、令她失望时 -1~3'
      - 单轮变化不超过 ±3,裂缝确认或命中隐痛也不放宽;超出会被系统裁剪

  户.<门牌>.妻.堕落值:
    type: number
    range: 0~100
    check:
      - 仅限有实质暧昧/亲密/性内容的回合:她被越界体验真实触动时可 +1~3,产生反感、退缩或失望时可 -1~3
      - 纯日常闲聊回合不机械增减;单轮变化只能在 -3~+3 内,超出时本字段整项回滚到本轮开始前的数值
      - 堕落值可能由脚本在后台回落;你不计算、不解释、也不执行这种后台回落,只提交本轮剧情造成的合法变化

  户.<门牌>.妻.身体开发.<小嘴|胸部|小屄|屁穴>:
    type: number
    range: 0~100
    check:
      - 仅限性场景回合,对应部位被认真对待时 +1~3;只增不减
      - 开发上限随她的接受程度受系统钳制,超出会被裁剪

  户.<门牌>.妻.当前心理想法:
    type: string
    check:
      - 仅妻本人在场对戏的回合更新她的内心独白,一两句,第一人称
      - 只写她此刻真实所想,不写数值和机制词
      - 只概括她此刻的意图、判断或矛盾;不得照抄本轮台词、呻吟、称呼或口头禅

  户.<门牌>.妻.当前情绪:
    type: string
    check:
      - 仅妻本人在场对戏时随剧情更新,如 平静/雀跃/局促/心虚/悸动

  户.<门牌>.妻.外装 / 户.<门牌>.妻.内衣 / 户.<门牌>.妻.妆容:
    type: string
    check:
      - 仅妻本人在场且她确实自行换装/补妆时更新,一句话描述
      - '{{user}}送的衣物穿戴由系统写入,你不动'

  户.<门牌>.夫.当前心理想法:
    type: string
    check:
      - 仅丈夫本人在场对戏的回合更新,一两句,第一人称
      - 只概括他此刻的意图、判断或矛盾;不得照抄本轮台词、称呼或口头禅

  户.<门牌>.夫.当前情绪:
    type: string
    check:
      - 仅丈夫本人在场对戏的回合更新
