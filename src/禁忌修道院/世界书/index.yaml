# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/worldbook.zh.json
# 说明:常驻条目用 蓝灯(常量);按名激活用 绿灯+关键字;插入位置必须带 顺序(新版 schema,旧版范例的"常驻"字段已废)

条目:
  # ============================================
  # 系统设定
  # ============================================
  - 文件夹: 系统设定
    条目:
      - 名称: 圣维罗妮卡修道院
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之后
          顺序: 100
        文件: 系统设定/世界观

      # 机制规则(人格防线/认知隔离/表现通道)不进世界书——藏在脚本里随快照每轮注入
      # (snapshotSystem.ts,玩家不可见不可关,且按场景动态裁剪)

      - 名称: '[开场白]打卡时进first_mes勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之后
          顺序: 100
        文件: 系统设定/开场白

  # ============================================
  # 角色(神父常驻;修女绿灯按名激活,焦点全量注入后续接脚本切片)
  # ============================================
  - 文件夹: 角色
    条目:
      - 名称: 神父
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 98
        文件: 角色/神父

      - 名称: 特蕾莎
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [特蕾莎, 院长]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/特蕾莎

      - 名称: 玛利亚
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [玛利亚, 纠察]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/玛利亚

      - 名称: 玛尔大
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [玛尔大, 司库, 账房]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/玛尔大

      - 名称: 希尔德加德
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [希尔德加德, 医务]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/希尔德加德

      - 名称: 爱洛伊丝
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [爱洛伊丝, 图书, 缮写室, 藏书塔]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/爱洛伊丝

      - 名称: 罗莎
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [罗莎, 厨娘, 厨房, 食堂]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/罗莎

      - 名称: 露西亚
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [露西亚, 见习]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/露西亚

      - 名称: 塞拉菲娜
        启用: true
        激活策略:
          类型: 绿灯
          关键字: [塞拉菲娜, 巡查, 视察]
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 角色/塞拉菲娜

  # ============================================
  # 变量系统
  # ============================================
  - 文件夹: 变量
    条目:
      - 名称: '[initvar]变量初始化勿开'
        启用: false
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 角色定义之前
          顺序: 100
        文件: 变量/initvar

      - 名称: '[mvu_update]变量更新规则'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 100
        文件: 变量/变量更新规则

      - 名称: '[mvu_update]变量输出格式'
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 99
        文件: 变量/变量输出格式

      - 名称: 变量更新列表
        启用: true
        激活策略:
          类型: 蓝灯
        插入位置:
          类型: 指定深度
          深度: 0
          顺序: 98
        内容: |
          ---
          <status_current_variable>
          {{format_message_variable::stat_data}}
          </status_current_variable>

# TODO(按 spec 顺序补):阶段行为(EJS 按堕落度渲染) / 现行院规快照(EJS) /
# 信仰值人格防线+禁词兜底 / 认知隔离 / 双通道快照表现层规则 / 事件注入
