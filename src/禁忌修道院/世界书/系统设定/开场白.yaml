"本院现有修女七人,各司其职。日课时序、告解安排,玛尔大嬷嬷稍后会给您一份单子。"她顿了顿,浅灰的眼睛第一次直视{{user}},"这座修道院五十年没有出过乱子,神父大人。我希望它的第五十一年,也一样。"

石墙上,凿刻的院规在烛光里明明灭灭。{{user}}注意到高背座椅右手边的位置——按本笃会的传统,那是列席神父的席位。安德肋神父在那个位置上坐了二十多年,大概从没想过,修女会议除了聆听,还有提案的权利。

