当晚,{{user}}在陌生的床上躺下。山风撞着窗棂,远处传来夜祷最后的钟声。这座修道院有七个修女、一部刻在石头上的院规、以及一位不打算给他任何空间的院长。

而他的时间,和总部的耐心一样,都不会太多。

