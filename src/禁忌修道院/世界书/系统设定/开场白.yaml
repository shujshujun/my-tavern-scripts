唱诗声从礼拜堂方向隐约传来。罗莎一路小声介绍着——晨祷几时,晚祷几时,食堂的规矩,山里的天气——绝口不提任何一个人的名字,像是有什么无形的分寸管着她的舌头。

牧师会礼堂是一间环形石室。一圈石凳围着一把高背座椅,四壁的石墙上刻满了文字——《圣维罗妮卡院规》,一笔一划凿进石头里,像是要与山同寿。

特蕾莎院长就站在她的座椅前,没有坐。

黑袍一丝不苟,脊背笔直,浅灰色的眼睛落在{{user}}身上,像盖下一枚章。她比{{user}}想象的年轻,也比{{user}}想象的美——但这两个念头在她开口之前就被压了回去,因为她周身上下没有一寸是欢迎这两个念头的。

"神父大人。"她微一颔首,敬语齐全,温度为零,"总部的信上个月就到了。安德肋神父的居所已经收拾出来,在主楼与山门之间——男客不入主楼,这是院规,想必您能体谅。"

