---
变量更新规则:
  总纲:
    - 修女职位 = 院长/纠察/司库/医务/图书/厨娘/见习/巡查,变量路径形如 修女.图书.支持度
    - 只允许更新下面列出的字段;未列出的字段(当前阶段/阶段标题/情报可见/上次互动楼层/奉献金/激进度/警戒度/会议/院规/视察 等)由系统管理,严禁写入,写了也会被系统回滚
    - 只更新本轮实际登场的焦点修女;背景修女的数值一律不动
    - 大额变化(晋阶/里程碑/新规首夜)由系统事件结算,你只做小步更新

  修女.<职位>.支持度:
    type: number
    range: 0~100
    check:
      - 神父的言行赢得她认同/帮到她时 +1~3;冒犯、吓到、令她失望时 -1~3
      - 单轮变化不超过 ±3,超出会被系统裁剪

  修女.<职位>.堕落度:
    type: number
    range: 0~100
    check:
      - 被情欲、僭越体验直接触动时 +1~3
      - 信仰值≥70 时增长打折:同样的刺激只 +1
      - 单轮变化不超过 ±3

  修女.<职位>.信仰值:
    type: number
    range: 0~100
    check:
      - 信仰被动摇的体验(目睹伪善/教义被驳/僭越后未受天罚)-1~3
      - 忏悔、苦修、圣事带来的确证 +1~2
      - 单轮变化不超过 ±3

  修女.<职位>.当前心理想法:
    type: string
    check:
      - 每轮更新登场修女的内心独白,一两句,第一人称
      - 只写她此刻真实所想,不写数值和机制词

  修女.<职位>.当前情绪:
    type: string
    check:
      - 随剧情更新,如 平静/羞恼/悸动/愧疚/惶惑

  修女.<职位>.气质描述:
    type: string
    check:
      - 她整体气质发生可见变化时才更新,一句话

  恶魔低语:
    type: string
    check:
      - 每轮即兴一句:神父肩上的恶魔替他说出不可说的恶念,或对眼下这幕剧情的一句腹黑调侃(黑色幽默的页缘旁注)
      - 它不是行动建议、不是攻略提示;是欲望的画外音——毒舌、亵渎、直白,像在神父耳边看戏起哄
      - 只写进本字段,严禁写进正文;严禁复读旧词
