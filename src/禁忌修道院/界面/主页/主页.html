<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>禁忌修道院 · 主页</title>
    <style>
      :root {
        --bg: #0d0a07;
        --bg2: #171008;
        --parchment: #e8dcc0;
        --parchment-dim: #b8a888;
        --gilt: #c9a227;
        --gilt-dim: #8a6f1e;
        --rubric: #a03a24;
        --sin: #7a2a4e;
        --ink: #2e2518;
        --font-main: 'Noto Serif SC', 'Source Han Serif SC', serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(175deg, var(--bg) 0%, var(--bg2) 45%, #060402 100%);
        color: var(--parchment);
        font-family: var(--font-main);
        font-size: 14px;
        line-height: 1.7;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% -10%, rgba(201, 162, 39, 0.12), transparent 55%),
          radial-gradient(ellipse at 85% 110%, rgba(122, 42, 78, 0.12), transparent 50%);
      }

      .stage {
        position: relative;
        max-width: 560px;
        margin: 0 auto;
        padding: 34px 20px 40px;
      }

      .cross {
        text-align: center;
        color: var(--gilt);
        font-size: 26px;
        letter-spacing: 0.5em;
        text-shadow: 0 0 18px rgba(201, 162, 39, 0.45);
      }

      h1 {
        margin: 8px 0 2px;
        text-align: center;
        font-size: 34px;
        letter-spacing: 0.22em;
        color: var(--parchment);
        text-shadow: 0 0 22px rgba(201, 162, 39, 0.3);
      }

      .subtitle {
        text-align: center;
        color: var(--parchment-dim);
        font-size: 12.5px;
        letter-spacing: 0.35em;
        margin-bottom: 26px;
      }

      .intro {
        border: 1px solid var(--gilt-dim);
        border-radius: 4px;
        background: rgba(232, 220, 192, 0.05);
        padding: 14px 16px;
        font-size: 13px;
        color: var(--parchment);
      }

      .intro em {
        color: var(--gilt);
        font-style: normal;
      }

      .section-title {
        margin: 24px 0 10px;
        color: var(--gilt);
        font-size: 13px;
        letter-spacing: 0.2em;
        text-align: center;
      }

      .section-title::before,
      .section-title::after {
        content: ' ✦ ';
        color: var(--gilt-dim);
      }

      .difficulty {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .diff-card {
        display: block;
        border: 1px solid var(--gilt-dim);
        border-radius: 4px;
        padding: 10px 14px;
        cursor: pointer;
        background: rgba(232, 220, 192, 0.04);
        transition: all 0.2s;
      }

      .diff-card input {
        display: none;
      }

      .diff-card.on {
        border-color: var(--gilt);
        background: rgba(201, 162, 39, 0.12);
        box-shadow: 0 0 14px rgba(201, 162, 39, 0.18);
      }

      .diff-name {
        font-weight: 700;
        letter-spacing: 0.1em;
      }

      .diff-desc {
        font-size: 12px;
        color: var(--parchment-dim);
        margin-top: 2px;
      }

      textarea {
        width: 100%;
        min-height: 60px;
        background: rgba(232, 220, 192, 0.06);
        border: 1px solid var(--gilt-dim);
        border-radius: 4px;
        color: var(--parchment);
        font-family: inherit;
        font-size: 13px;
        padding: 9px 12px;
        resize: vertical;
      }

      textarea::placeholder {
        color: rgba(184, 168, 136, 0.55);
      }

      .go {
        display: block;
        width: 100%;
        margin-top: 26px;
        padding: 13px 0;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.35em;
        color: var(--bg);
        background: linear-gradient(180deg, var(--gilt) 0%, var(--gilt-dim) 100%);
        border: none;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: 0 0 24px rgba(201, 162, 39, 0.25);
      }

      .go:disabled {
        opacity: 0.5;
        cursor: wait;
      }

      .hint {
        margin-top: 12px;
        text-align: center;
        color: var(--parchment-dim);
        font-size: 11.5px;
      }

      .footer {
        margin-top: 30px;
        text-align: center;
        color: rgba(184, 168, 136, 0.45);
        font-size: 11px;
        letter-spacing: 0.15em;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="cross">✠</div>
      <h1>禁忌修道院</h1>
      <div class="subtitle">SANCTA VERONICA · 圣维罗妮卡修道院</div>

      <div class="intro">
        19世纪末,深山之巅。老神父病故,总部把刚晋铎的<em>你</em>派上山顶缺。
        这里有七位修女、一部刻在石墙上的院规、一位不打算给你任何空间的院长——
        以及一条五十年无人动用过的程序:<em>修女会议,可以修订院规</em>。<br />
        攻略修女攒下选票,在会议上一档一档篡改这座修道院的规则,直到它变成你想要的形状。
      </div>

      <div class="section-title">此行的凶险</div>
      <div class="difficulty" id="difficulty">
        <label class="diff-card on" data-k="忏悔者">
          <input type="radio" name="diff" value="忏悔者" checked />
          <span class="diff-name">忏悔者(标准)</span>
          <div class="diff-desc">会议间隔 15-20 楼 · 视察阈值 60 —— 推荐首次游玩</div>
        </label>
        <label class="diff-card" data-k="苦修者">
          <input type="radio" name="diff" value="苦修者" />
          <span class="diff-name">苦修者(困难)</span>
          <div class="diff-desc">会议间隔 18-24 楼 · 视察阈值 45 —— 票更难攒,总部盯得更紧</div>
        </label>
        <label class="diff-card" data-k="异端">
          <input type="radio" name="diff" value="异端" />
          <span class="diff-name">异端(地狱)</span>
          <div class="diff-desc">会议间隔 20-28 楼 · 视察阈值 35 —— 每一步都在悬崖边</div>
        </label>
      </div>

      <div class="section-title">神父不为人知的癖好(选填)</div>
      <textarea id="kink" placeholder="写下你的私癖,AI 会在叙事中隐蔽体现,永不点破。例:偏爱看她们攥紧念珠强自镇定的样子……(留空亦可)"></textarea>

      <button class="go" id="go">签署调令 · 启程上山</button>
      <div class="hint" id="hint">签署后将直接进入到任之日</div>

      <div class="footer">禁忌修道院 · 重置版 内测</div>
    </div>

    <script>
      // 难度卡选中态
      $('#difficulty .diff-card').on('click', function () {
        $('#difficulty .diff-card').removeClass('on');
        $(this).addClass('on');
      });

      // 签署:写配置 → 重掷倒计时 → 程序化切到开场白 swipe(云霜凝主页同款)
      $('#go').on('click', async function () {
        const $btn = $(this).prop('disabled', true);
        try {
          const 难度 = $('#difficulty .diff-card.on').attr('data-k') || '忏悔者';
          const 私癖 = String($('#kink').val() || '').trim();
          await insertOrAssignVariables({ _设置: { 难度: 难度, 私癖: 私癖 } }, { type: 'chat' });
          eventEmit('禁忌修道院:序章完成');

          const messages = await getChatMessages('0', { include_swipes: true });
          if (!messages || !messages[0] || !messages[0].swipes || messages[0].swipes[1] === undefined) {
            $('#hint').text('未找到开场白:请确认卡片的"可选开场白"里已加入到任之日,然后手动右滑一次。');
            $btn.prop('disabled', false);
            return;
          }

          // 消息变量是 per-swipe 的:先取 swipe0(主页)上 MVU 初始化好的 stat_data,
          // 切到开场白 swipe 后若目标 swipe 缺档,把存档带过去(云霜凝主页同款处理)
          const 主页变量 = getVariables({ type: 'message', message_id: 0 });
          const 存档 = 主页变量 && 主页变量.stat_data ? 主页变量.stat_data : null;

          await setChatMessage(messages[0].swipes[1], 0, {
            swipe_id: 1,
            refresh: 'display_and_render_current',
          });

          if (存档) {
            await updateVariablesWith(
              function (variables) {
                if (!variables.stat_data) variables.stat_data = 存档;
                return variables;
              },
              { type: 'message', message_id: 0 },
            );
          }
        } catch (e) {
          console.error('[禁忌修道院主页] 启程失败:', e);
          $('#hint').text('启程失败:' + (e && e.message ? e.message : String(e)));
          $btn.prop('disabled', false);
        }
      });
    </script>
  </body>
</html>
